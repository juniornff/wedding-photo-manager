# Despliegue: baja las imágenes publicadas en GHCR por el workflow cd.yml.
# Requiere: docker login ghcr.io (PAT con read:packages) y un .env raíz.
# Versiones: TAG=latest (default) o TAG=<sha-x.y.z> para rollback (TAG se lee del .env).
services:
  backend:
    container_name: wedding-photo-manager-backend
    image: ghcr.io/juniornff/wedding-photo-manager-backend:${TAG:-latest}
    restart: unless-stopped
    volumes:
      - ./Fotos:/app/Fotos
      - ./Miniaturas:/app/Miniaturas
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NOVIO_EMAIL=${NOVIO_EMAIL}
      - NOVIO_PASSWORD=${NOVIO_PASSWORD}
      - NOVIA_EMAIL=${NOVIA_EMAIL}
      - NOVIA_PASSWORD=${NOVIA_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}

  frontend:
    container_name: wedding-photo-manager-frontend
    image: ghcr.io/juniornff/wedding-photo-manager-frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
