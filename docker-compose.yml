# Despliegue: baja las imágenes publicadas en GHCR por el workflow cd.yml.
# Funciona SIN .env (ejemplos abajo); crea un .env en la raíz para sobrescribirlos.
# Requiere: docker login ghcr.io (PAT con read:packages) para bajar imágenes privadas.
# Versiones: TAG=latest (default) o TAG=<sha|X.Y.Z> para rollback (TAG se lee del .env).
services:
  backend:
    container_name: wedding-photo-manager-backend
    image: ghcr.io/juniornff/wedding-photo-manager-backend:${TAG:-latest}
    restart: unless-stopped
    volumes:
      - ./Fotos:/app/Fotos
      - ./Miniaturas:/app/Miniaturas
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - NOVIO_EMAIL=${NOVIO_EMAIL:-groom@example.com}
      - NOVIO_PASSWORD=${NOVIO_PASSWORD:-groom123}
      - NOVIA_EMAIL=${NOVIA_EMAIL:-bride@example.com}
      - NOVIA_PASSWORD=${NOVIA_PASSWORD:-bride123}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}

  frontend:
    container_name: wedding-photo-manager-frontend
    image: ghcr.io/juniornff/wedding-photo-manager-frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
