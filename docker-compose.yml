services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./Fotos:/app/Fotos
      - ./Miniaturas:/app/Miniaturas
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8001
    ports:
      - "5173:5173"
    depends_on:
      - backend
