# Desarrollo: construye desde el código fuente (backend + Dockerfile.dev con Vite).
# Funciona SIN .env (ejemplos abajo); crea un .env en la raíz para sobrescribirlos.
services:
  backend:
    container_name: wedding-photo-manager-backend
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./Fotos:/app/Fotos
      - ./Miniaturas:/app/Miniaturas
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - NOVIO_EMAIL=${NOVIO_EMAIL:-groom@example.com}
      - NOVIO_PASSWORD=${NOVIO_PASSWORD:-groom123}
      - NOVIA_EMAIL=${NOVIA_EMAIL:-bride@example.com}
      - NOVIA_PASSWORD=${NOVIA_PASSWORD:-bride123}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}

  frontend:
    container_name: wedding-photo-manager-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - VITE_PROXY_TARGET=${VITE_PROXY_TARGET:-http://backend:8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend