services:
  backend:
    container_name: wedding-photo-manager-backend
    build: ./backend
    restart: unless-stopped
    networks:
      - default
      - proxy-net
    volumes:
      - ./Fotos:/app/Fotos
      - ./Miniaturas:/app/Miniaturas
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NOVIO_EMAIL=${NOVIO_EMAIL}
      - NOVIO_PASSWORD=${NOVIO_PASSWORD}
      - NOVIA_EMAIL=${NOVIA_EMAIL}
      - NOVIA_PASSWORD=${NOVIA_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}

  frontend:
    container_name: wedding-photo-manager-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - VITE_PROXY_TARGET=${VITE_PROXY_TARGET:-http://backend:8000}
    networks:
      - default
      - proxy-net
    depends_on:
      - backend

networks:
  proxy-net:
    external: true